# HTTP — redirect to HTTPS
server {
  listen 80 default_server;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS
server {
  listen 443 ssl http2 default_server;
  server_name _;

  ssl_certificate /etc/nginx/ssl/live/fluxpipe/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/fluxpipe/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  ssl_stapling on;
  ssl_stapling_verify on;

  client_max_body_size 5m;

  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Trace-Id $http_x_trace_id;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /v1/ingest {
    proxy_pass http://ingestion;
    proxy_http_version 1.1;
  }

  location /v1/auth {
    proxy_pass http://management;
    proxy_http_version 1.1;
  }

  location /v1/pipelines {
    proxy_pass http://management;
    proxy_http_version 1.1;
  }

  location /v1/destinations {
    proxy_pass http://management;
    proxy_http_version 1.1;
  }

  location /v1/api-keys {
    proxy_pass http://management;
    proxy_http_version 1.1;
  }

  location /v1/usage {
    proxy_pass http://management;
    proxy_http_version 1.1;
  }

  location /v1/deliveries {
    proxy_pass http://delivery;
    proxy_http_version 1.1;
  }

  location /health {
    proxy_pass http://management;
    proxy_http_version 1.1;
  }

  location / {
    return 404;
  }
}
