upstream management {
  server management-service:3001;
}

upstream ingestion {
  server ingestion-service:3002;
  server ingestion-service:3002;
}

upstream delivery {
  server delivery-service:3004;
  server delivery-service:3004;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 5m;

  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Trace-Id $http_x_trace_id;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /v1/ingest {
    proxy_pass http://ingestion;
    proxy_http_version 1.1;
  }

  location /v1/auth {
    proxy_pass http://management;
    proxy_http_version 1.1;
  }

  location /v1/pipelines {
    proxy_pass http://management;
    proxy_http_version 1.1;
  }

  location /v1/destinations {
    proxy_pass http://management;
    proxy_http_version 1.1;
  }

  location /v1/api-keys {
    proxy_pass http://management;
    proxy_http_version 1.1;
  }

  location /v1/usage {
    proxy_pass http://management;
    proxy_http_version 1.1;
  }

  location /v1/deliveries {
    proxy_pass http://delivery;
    proxy_http_version 1.1;
  }

  location /health {
    proxy_pass http://management;
    proxy_http_version 1.1;
  }

  location / {
    return 404;
  }
}
