server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /v1/ingest { proxy_pass http://ingestion-service:3002; }
  location /v1/deliveries { proxy_pass http://delivery-service:3004; }
  location /v1/ { proxy_pass http://management-service:3001; }

  location / { try_files $uri /index.html; }
}
